lvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">0,565</text><text x="323" y="119.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0b0b0b">Строгий судья</text><rect x="335" y="108.0" width="314.7" height="14" rx="4" fill="#2a78d6"/><text x="655.7" y="119.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">0,807</text><text x="323" y="149.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0b0b0b">Мягкий судья</text><rect x="335" y="138.0" width="329.5" height="14" rx="4" fill="#2a78d6"/><text x="670.5" y="149.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">0,845</text><text x="323" y="179.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0b0b0b">Мягкий судья, роль «другое» снимает</text><rect x="335" y="168.0" width="336.6" height="14" rx="4" fill="#2a78d6"/><text x="677.6" y="179.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">0,863</text><text x="323" y="209.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600" fill="#0b0b0b">Три эксперта: мягкий + строгий + арбитр</text><rect x="335" y="198.0" width="348.7" height="14" rx="4" fill="#eb6834"/><text x="689.7" y="209.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">0,894</text></svg>