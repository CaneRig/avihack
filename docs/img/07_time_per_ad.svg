<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Время на одно объявление по конфигурациям (RTX 3060)"><rect width="800" height="220" fill="#fcfcfb"/><text x="20" y="30" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600" fill="#0b0b0b">Время на одно объявление по конфигурациям (RTX 3060)</text><text x="20" y="50" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#52514e">Среднее, секунды, включая объявления, для которых модель не вызывается (benchmark.py).</text><line x1="335.0" y1="70" x2="335.0" y2="190" stroke="#e4e3df" stroke-width="1"/><text x="335.0" y="206" text-anchor="middle" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#52514e">0</text><line x1="432.5" y1="70" x2="432.5" y2="190" stroke="#e4e3df" stroke-width="1"/><text x="432.5" y="206" text-anchor="middle" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#52514e">2</text><line x1="530.0" y1="70" x2="530.0" y2="190" stroke="#e4e3df" stroke-width="1"/><text x="530.0" y="206" text-anchor="middle" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#52514e">5</text><line x1="627.5" y1="70" x2="627.5" y2="190" stroke="#e4e3df" stroke-width="1"/><text x="627.5" y="206" text-anchor="middle" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#52514e">8</text><line x1="725.0" y1="70" x2="725.0" y2="190" stroke="#e4e3df" stroke-width="1"/><text x="725.0" y="206" text-anchor="middle" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#52514e">10</text><text x="323" y="89.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0b0b0b">Один судья, только категории (публичный тест)</text><rect x="335" y="78.0" width="50.7" height="14" rx="4" fill="#2a78d6"/><text x="391.7" y="89.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">1,3 с</text><text x="323" y="119.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600" fill="#0b0b0b">Три эксперта, только категории (публичный тест)</text><rect x="335" y="108.0" width="124.8" height="14" rx="4" fill="#eb6834"/><text x="465.8" y="119.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">3,2 с</text><text x="323" y="149.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0b0b0b">Один судья + черновики от LLM (трудные примеры)</text><rect x="335" y="138.0" width="234.0" height="14" rx="4" fill="#2a78d6"/><text x="575.0" y="149.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">6,0 с</text><text x="323" y="179.0" text-anchor="end" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600" fill="#0b0b0b">Три эксперта + черновики от LLM (трудные примеры)</text><rect x="335" y="168.0" width="323.7" height="14" rx="4" fill="#eb6834"/><text x="664.7" y="179.0" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600" fill="#0b0b0b">8,3 с</text></svg>