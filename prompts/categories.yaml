# Справочник категорий для подсказок и шаблона (по task/microcategories-guide.md)
102:
  name: Штукатурные работы
  definition: Оштукатуривание и выравнивание стен, углов и откосов штукатурными составами (по маякам, механизированная штукатурка). Шпаклёвка и покраска сюда не входят.
  template_title: Штукатурные работы
  intro: "Выполняем штукатурные работы:"
103:
  name: Плиточные работы
  definition: Укладка и облицовка плиткой, керамогранитом и мозаикой на стенах и полах, фартуки, душевые зоны, затирка швов, запил плитки.
  template_title: Плиточные работы
  intro: "Выполняем плиточные работы:"
104:
  name: Сантехника
  definition: Монтаж, замена, подключение и ремонт сантехники и труб; водоснабжение, канализация, радиаторы и водяное отопление, смесители, унитазы, ванны, подключение стиральных и посудомоечных машин.
  template_title: Сантехнические работы
  intro: "Выполняем сантехнические работы:"
105:
  name: Электрика
  definition: Электропроводка, розетки и выключатели, освещение, электрощиты, штробление под проводку, электрический тёплый пол, диагностика электросети.
  template_title: Электромонтажные работы
  intro: "Выполняем электромонтажные работы:"
106:
  name: Поклейка обоев и малярные работы
  definition: Поклейка обоев и стеклохолста, покраска стен и потолков, шпаклёвка, грунтование и шлифовка под покраску или обои.
  template_title: Поклейка обоев и покраска
  intro: "Выполняем малярные работы и поклейку обоев:"
